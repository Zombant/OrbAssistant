esphome:
  name: orbassistant
  friendly_name: OrbAssistant
  on_boot:
    - priority: -100
      then:
        - wait_until: api.connected
        - delay: 1s
        - voice_assistant.start_continuous:
        - if:
            condition:
              switch.is_on: voice_assistant_enabled
            then:
              - voice_assistant.start_continuous:

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "" # TODO

ota:
  - platform: esphome
    password: "" # TODO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Orbassistant Fallback Hotspot"
    password: "" # TODO

captive_portal:
  

i2s_audio:
  - id: i2s_hub
    i2s_lrclk_pin: GPIO2
    i2s_bclk_pin: GPIO3

microphone:
  - platform: i2s_audio
    id: esp32_mic
    i2s_audio_id: i2s_hub
    i2s_din_pin: GPIO4
    adc_type: external
    pdm: false
    channel: left
    on_data:
      - logger.log:
          format: "Mic data received: %d bytes"
          args: ['x.size()']

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: i2s_hub
    i2s_dout_pin: GPIO5
    dac_type: external

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    id: assistant_led
    name: "Orb Assistant LED"
    pin: GPIO7
    num_leds: 12          
    chipset: WS2812
    effects:
      - pulse:
          name: "Breathing"
          transition_length: 1s
          update_interval: 1s
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%
      - addressable_rainbow:
          name: "Rainbow Sweep Fast"
          speed: 60
          width: 50
      - addressable_rainbow:
          name: "Rainbow Sweep Slow"
          speed: 10
          width: 50

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Reset Button"
    on_press:
      - voice_assistant.stop
      - delay: 1s
      - voice_assistant.start_continuous:
  
voice_assistant:
  id: orb_voice_assistant
  microphone: esp32_mic
  speaker: esp32_speaker
  noise_suppression_level: 2
  use_wake_word: true

  on_wake_word_detected:
    - homeassistant.action:
        action: script.store_current_orb_led
    - light.turn_on:
        id: assistant_led
        blue: 100%
        red: 0%
        green: 100%
        brightness: 100%
        effect: "Fast Pulse"
    - logger.log:
          format: "on_wake_word_detected"

  on_listening:
    - light.turn_on:
        id: assistant_led
        blue: 100%
        red: 0%
        green: 0%
        brightness: 100%
        effect: "Slow Pulse"
    - logger.log:
          format: "on_listening"

  on_stt_vad_end:
    - light.turn_on:
        id: assistant_led
        blue: 100%
        red: 0%
        green: 0%
        brightness: 100%
        effect: "Fast Pulse"
    - logger.log:
          format: "on_stt_vad_end"

  on_tts_stream_start:
    - light.turn_on:
        id: assistant_led
        brightness: 100%
        blue: 0%
        red: 0%
        green: 0%
        effect: "Rainbow Sweep Fast"
    - logger.log:
          format: "on_tts_stream_start"
  
  on_end:
    - logger.log:
          format: "on_end"


  on_error:
    - light.turn_on:
        id: assistant_led
        brightness: 100%
        blue: 0%
        red: 100%
        green: 0%
        effect: none
    - voice_assistant.stop
    - delay: 1s
    - voice_assistant.start_continuous:
    - delay: 2s
    - homeassistant.service:
        service: scene.turn_on
        data:
          entity_id: scene.orb_led_temp_state
    - light.turn_on:
        id: assistant_led
        effect: "none"
    - logger.log:
          format: "on_error"

switch:
  - platform: template
    name: "Voice Assistant Enabled"
    id: voice_assistant_enabled
    icon: "mdi:microphone"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - voice_assistant.start_continuous:
    turn_off_action:
      - voice_assistant.stop:
